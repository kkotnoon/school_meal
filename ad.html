<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>광고</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: sans-serif;
      font-size: 14px;
    }

    #adContainer {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 320px;
      height: 50px;
      z-index: 9999;
    }

    #adNotice {
      display: none;
      padding: 10px;
      color: #555;
      background-color: #fdf3d1;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <div id="adContainer">
    <script id="adScript" type="text/javascript" src="//pl26352759.profitableratecpm.com/98/53/a7/9853a70e54bf0c8fb97ddabbc9e6181b.js"></script>
    <div id="adNotice">📢 광고 차단이 감지되었습니다! 광고는 사이트 유지에 도움이 돼요 😊</div>
  </div>

  <script>
    window.addEventListener("load", function () {
      setTimeout(() => {
        const adScript = document.getElementById("adScript");
        const adNotice = document.getElementById("adNotice");

        // 광고 차단됐는지 확인
        const isBlocked = !adScript || adScript.offsetHeight === 0;

        if (isBlocked) {
          adNotice.style.display = "block";
        }
      }, 1500);
    });
  </script>
</body>
</html>
